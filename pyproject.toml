[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-argument-sanitizer"
version = "0.1.0"
description = "Schema-enforcing type caster, injection shield, and zero-day payload sanitizer for untrusted model function call outputs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
tool-call-argument-sanitizer = "tool_call_argument_sanitizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tool_call_argument_sanitizer*"]
